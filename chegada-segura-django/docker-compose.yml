services:
  db:
    image: postgres:17-alpine
    container_name: chegada-segura-db
    environment:
      POSTGRES_DB: chegada_segura
      POSTGRES_USER: chegada
      POSTGRES_PASSWORD: chegada
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chegada -d chegada_segura"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    container_name: chegada-segura-web
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: sh -c "python manage.py migrate && python manage.py seed_demo && gunicorn chegada_segura.wsgi:application --bind 0.0.0.0:8000 --workers 3"
volumes:
  postgres_data:
